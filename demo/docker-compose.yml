services:
  firebird5:
    image: ghcr.io/attid/firebirdviewer-demo:latest
    restart: always
    environment:
      - FIREBIRD_ROOT_PASSWORD=secret
      - FIREBIRD_USER=demo
      - FIREBIRD_PASSWORD=demo
      - FIREBIRD_DATABASE_DEFAULT_CHARSET=UTF8
      - TZ=UTC

      # hardening:
      - FIREBIRD_CONF_DatabaseAccess=Full
      - FIREBIRD_CONF_WireCrypt=Required
      - FIREBIRD_CONF_AuthServer=Srp
      - FIREBIRD_CONF_AuthClient=Srp
      - FIREBIRD_CONF_UserManager=Srp

    volumes:
      - firebird_demo_data:/var/lib/firebird/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # reset DB every hour
  firebird_reset:
    image: ghcr.io/attid/firebirdviewer-demo:latest
    restart: always
    depends_on:
      - firebird5
    environment:
      - FIREBIRD_ROOT_PASSWORD=secret
      - TZ=UTC
      - RESET_EVERY_SECONDS=3600
      #- FULL_RESET=true
      - DEMO_PASS=demo
      - DEMO_USER=DEMO
      - SEED_DB=/seed/employee.fdb
    volumes:
      - firebird_demo_data:/var/lib/firebird/data
    entrypoint: ["/bin/bash", "/reset.sh"]

  viewer:
    image: ghcr.io/attid/firebirdviewer:latest
    restart: always
    depends_on:
      - firebird5
    environment:
      - TZ=UTC
      - DEMO_MODE=true
      - DEMO_DATABASE=firebird5:employee
      - DEMO_USER=demo
      - DEMO_PASSWORD=demo
    ports:
      - "8080:5001"

volumes:
  firebird_demo_data:
