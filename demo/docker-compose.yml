services:
  firebird5:
    image: ghcr.io/attid/firebirdviewer-demo:latest
    restart: unless-stopped
    environment:
      - FIREBIRD_ROOT_PASSWORD=replace_with_random_root_password
      - FIREBIRD_USER=demo
      - FIREBIRD_PASSWORD=demo
      - FIREBIRD_DATABASE_DEFAULT_CHARSET=UTF8
      - FIREBIRD_CONF_DatabaseAccess=None
      - FIREBIRD_CONF_WireCrypt=Required
      - FIREBIRD_CONF_AuthServer=Srp
      - FIREBIRD_CONF_AuthClient=Srp
      - FIREBIRD_CONF_UserManager=Srp
      - TZ=UTC
    volumes:
      - firebird_demo_data:/var/lib/firebird/data
    networks: [backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "echo >/dev/tcp/127.0.0.1/3050"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}

  firebird_reset:
    image: ghcr.io/attid/firebirdviewer-demo:latest
    restart: unless-stopped
    depends_on:
      firebird5: {condition: service_healthy}
    environment:
      - FIREBIRD_ROOT_PASSWORD=replace_with_random_root_password
      - RESET_EVERY_SECONDS=3600
      - DEMO_PASS=demo
      - DEMO_USER=DEMO
      - SEED_DB=/seed/employee.fdb
      - TZ=UTC
    volumes:
      - firebird_demo_data:/var/lib/firebird/data
    entrypoint: ["/bin/bash", "/reset.sh"]
    user: "84:84"
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "test -s /var/lib/firebird/data/employee.fdb"]
      interval: 5s
      timeout: 3s
      retries: 24

  viewer:
    image: ghcr.io/attid/firebirdviewer:latest
    restart: unless-stopped
    depends_on:
      firebird_reset: {condition: service_healthy}
    environment:
      - DEMO_MODE=true
      - DEMO_DATABASE=firebird5:employee
      - DEMO_USER=demo
      - DEMO_PASSWORD=demo
      - DEMO_QUERY_TIMEOUT_MS=15000
      - DEMO_QUERY_MAX_ROWS=1000
      - DEMO_QUERY_MAX_BYTES=2097152
      - DEMO_QUERY_CONCURRENCY=4
      - TZ=UTC
    networks: [backend, frontend]
    read_only: true
    volumes:
      - viewer_state:/run/firebirdviewer
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}

  proxy:
    image: traefik:latest
    restart: unless-stopped
    depends_on:
      viewer: {condition: service_healthy}
    command: [--configFile=/etc/traefik/traefik.yml]
    ports: ["8080:8080"]
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks: [frontend]
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  frontend:
  backend: {internal: true}

volumes:
  firebird_demo_data:
  viewer_state:
