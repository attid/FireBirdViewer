name: Build and push Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_digest:
        description: Existing firebirdviewer image digest to retag
        required: false
        type: string
      target_tag:
        description: Tag to assign to source_digest
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: attid/firebirdviewer
  DEMO_IMAGE_NAME: attid/firebirdviewer-demo

jobs:
  retag-existing-image:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_digest != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate retag inputs
        env:
          SOURCE_DIGEST: ${{ inputs.source_digest }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          test -n "$SOURCE_DIGEST"
          test -n "$TARGET_TAG"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag existing viewer image
        env:
          SOURCE_DIGEST: ${{ inputs.source_digest }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          docker buildx imagetools create \
            --tag "$REGISTRY/$IMAGE_NAME:$TARGET_TAG" \
            "$REGISTRY/$IMAGE_NAME@$SOURCE_DIGEST"

  build-and-push:
    if: ${{ github.event_name == 'push' || inputs.source_digest == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          VERSION=$(cat VERSION)
          docker build --build-arg VERSION=$VERSION -t $REGISTRY/$IMAGE_NAME:latest -t $REGISTRY/$IMAGE_NAME:$VERSION .
          docker build -f demo/Dockerfile -t $REGISTRY/$DEMO_IMAGE_NAME:latest -t $REGISTRY/$DEMO_IMAGE_NAME:$VERSION demo

      - name: Push Docker image
        run: |
          VERSION=$(cat VERSION)
          docker push $REGISTRY/$IMAGE_NAME:latest
          docker push $REGISTRY/$IMAGE_NAME:$VERSION
          docker push $REGISTRY/$DEMO_IMAGE_NAME:latest
          docker push $REGISTRY/$DEMO_IMAGE_NAME:$VERSION

      - name: Notify Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id": "-1003579960813", "text": "Docker image pushed to registry /info_firebirdviewer_viewer_1"}'
      
          
