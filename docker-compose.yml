# FireBird Viewer — Docker Compose
#
# Usage:
#   docker compose up -d
#
# Environment variables (all optional):
#
#   AI_BASE_URL  — OpenAI-compatible API base URL
#                  (e.g. https://api.openai.com/v1, https://openrouter.ai/api/v1,
#                   http://host.docker.internal:11434/v1 for local Ollama)
#   AI_API_KEY   — API key for the LLM provider
#   AI_MODEL     — Model name (e.g. gpt-4o-mini, google/gemini-2.0-flash-exp)
#
# AI_BASE_URL and AI_MODEL pre-fill the UI settings.
# AI_API_KEY stays on the server only (never sent to the browser)
# and is used as a fallback when the user doesn't provide their own key.

services:
  viewer:
    build: .
    # image: ghcr.io/attid/firebirdviewer:latest  # uncomment to use pre-built image
    container_name: firebird-viewer
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - TZ=Europe/Moscow
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:-change-me-in-production}
      # AI Assistant (optional — remove or leave empty to skip)
      # - AI_BASE_URL=https://openrouter.ai/api/v1
      # - AI_API_KEY=sk-or-...
      # - AI_MODEL=google/gemini-2.0-flash-exp
