# Replace SESSION_SECRET_KEY before starting. Placeholder values fail closed.
services:
  viewer:
    build: .
    image: ghcr.io/attid/firebirdviewer:latest
    restart: unless-stopped
    ports: ["5001:5001"]
    environment:
      - SESSION_SECRET_KEY=replace_with_random_session_secret
      - APP_ROOT_PATH=
      - TZ=Europe/Moscow
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run/firebirdviewer:size=1m,mode=0700,uid=10001,gid=10001
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
